<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><title>NMH Bản tin AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:560px;margin:auto;min-height:100dvh;padding:18px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;letter-spacing:.3px;font-size:14px}header>span:first-child{white-space:nowrap}header .row{flex-wrap:nowrap;gap:6px}header .small{padding:8px 10px;font-size:12px;white-space:nowrap}
button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:700;background:#334155;color:#fff;cursor:pointer}
button:disabled{opacity:.45}.primary{background:#2563eb}.danger{background:#b91c1c}.small{font-size:13px;padding:9px 11px}
.sel{background:#2563eb;outline:2px solid #93c5fd}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.panel{background:#1e293b;border-radius:14px;padding:12px}.hint{color:#cbd5e1;font-size:13px;line-height:1.55}
.history{flex:1;min-height:38vh;max-height:52vh;overflow:auto;background:#1e293b;border-radius:14px;padding:12px}
.b{padding:10px 12px;margin:8px 0;border-radius:12px;white-space:pre-wrap;line-height:1.5;background:#334155}.b.user{background:#1d4ed8;margin-left:15%}.b.assistant{margin-right:10%}
.talk{font-size:22px;min-width:170px;padding:18px 24px}.hidden{display:none!important}
#err{color:#fecaca;white-space:pre-wrap;font-size:14px}input[type=text],input[type=url]{width:100%;padding:13px;border-radius:11px;border:1px solid #64748b;background:#0f172a;color:#fff;font-size:16px}
label.ck{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px}label.ck input{width:20px;height:20px}
details summary{cursor:pointer;font-weight:700}a{color:#93c5fd}.art{padding:8px 0;border-bottom:1px solid #334155;font-size:14px;line-height:1.45}
.src{font-size:12px;color:#94a3b8}

.avatar{display:flex;justify-content:center;margin:2px 0 -4px}.avatar svg{width:150px;height:150px;overflow:visible}
.av-head{transform-origin:100px 120px;transition:transform .4s}.st-listening .av-head{transform:rotate(-4deg)}
.av-lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
.av-pupil{transition:transform .35s;transform-box:fill-box;transform-origin:center}.st-thinking .av-pupil{transform:translate(5px,-7px)}.st-listening .av-pupil{transform:scale(1.15)}
.av-eye{transform-box:fill-box;transform-origin:center;transition:transform .3s}.st-listening .av-eye{transform:scale(1.12)}
.av-bulb{fill:#64748b;transition:fill .3s}.st-listening .av-bulb{fill:#22c55e}.st-thinking .av-bulb{fill:#f59e0b;animation:pulse .7s infinite alternate}.st-speaking .av-bulb{fill:#60a5fa}
@keyframes pulse{to{opacity:.35}}.av-ring{fill:none;stroke:#22c55e;stroke-width:3;opacity:0}.st-listening .av-ring{animation:ring 1.4s infinite}
.av-ring{transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.av-dots{opacity:0;transition:opacity .3s}.st-thinking .av-dots{opacity:1}.av-dots circle{animation:dot 1s infinite}.av-dots circle:nth-child(2){animation-delay:.2s}.av-dots circle:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{transform:translateY(-5px)}}.st-idle .av-head{animation:bob 5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(3px)}}
#admin h3{margin:18px 0 8px}.kv{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:4px 10px;font-size:14px}.bar{height:12px;border-radius:7px;background:#334155;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#22c55e}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t td,table.t th{padding:6px 4px;border-bottom:1px solid #334155;text-align:left;vertical-align:top}.ok{color:#86efac}.bad{color:#fca5a5}
</style></head><body><main class="shell">
<header><span>NMH · BẢN TIN AI</span><span class="row"><button id="adminBtn" class="small hidden">QUẢN TRỊ</button><button id="prefsBtn" class="small hidden">NGUỒN TIN</button><button id="logoutBtn" class="small hidden">THOÁT</button></span></header>

<section id="login" class="panel hidden"><h3 style="margin-top:0">Đăng nhập</h3><p class="hint">Đăng nhập bằng tài khoản Google đã được cấp quyền.</p><div id="gbtn"></div><p id="loginMsg" class="hint"></p></section>

<section id="talk" class="hidden" style="display:flex;flex-direction:column;gap:12px;flex:1">
 <div class="avatar st-idle" id="avatar" aria-hidden="true"><svg viewBox="0 0 200 200">
  <g class="av-head">
   <line x1="100" y1="34" x2="100" y2="14" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
   <circle class="av-ring" cx="100" cy="12" r="8"/><circle class="av-bulb" cx="100" cy="12" r="8"/>
   <rect x="28" y="34" width="144" height="122" rx="44" fill="#e2e8f0"/>
   <rect x="16" y="78" width="16" height="36" rx="8" fill="#cbd5e1"/><rect x="168" y="78" width="16" height="36" rx="8" fill="#cbd5e1"/>
   <rect x="42" y="50" width="116" height="90" rx="34" fill="#0f172a"/>
   <g class="av-eye"><ellipse cx="76" cy="88" rx="17" ry="20" fill="#f8fafc"/><g class="av-pupil"><circle cx="78" cy="91" r="8.5" fill="#1e293b"/><circle cx="81" cy="87" r="3" fill="#fff"/></g><rect class="av-lid" x="58" y="67" width="36" height="42" rx="16" fill="#0f172a"/></g>
   <g class="av-eye"><ellipse cx="124" cy="88" rx="17" ry="20" fill="#f8fafc"/><g class="av-pupil"><circle cx="126" cy="91" r="8.5" fill="#1e293b"/><circle cx="129" cy="87" r="3" fill="#fff"/></g><rect class="av-lid" x="106" y="67" width="36" height="42" rx="16" fill="#0f172a"/></g>
   <ellipse cx="58" cy="116" rx="8" ry="5" fill="#fb7185" opacity=".55"/><ellipse cx="142" cy="116" rx="8" ry="5" fill="#fb7185" opacity=".55"/>
   <rect id="avMouth" x="88" y="120" width="24" height="4" rx="2" fill="#f472b6"/>
   <g class="av-dots" fill="#f59e0b"><circle cx="150" cy="40" r="4"/><circle cx="162" cy="34" r="4"/><circle cx="174" cy="28" r="4"/></g>
  </g></svg></div>
 <div class="row" role="group" aria-label="Phong cách"><button data-style="danh_da" class="small">ĐANH ĐÁ</button><button data-style="chem_gio" class="small">CHÉM GIÓ</button><button data-style="nghiem_tuc" class="small">NGHIÊM TÚC</button></div>
 <div id="status" class="panel" role="status">Chưa bắt đầu</div>
 <div id="history" class="history" aria-live="polite"></div>
 <div class="row"><button id="start" class="primary talk">NÓI</button><button id="interrupt" class="hidden">NGẮT</button><button id="resume" class="hidden">TIẾP TỤC</button><button id="stop" class="danger hidden">KẾT THÚC</button></div>
 <form id="typeForm" class="row" style="flex-wrap:nowrap"><input id="typeIn" type="text" placeholder="Hoặc gõ câu hỏi…" autocomplete="off"><button class="small">GỬI</button></form>
 <div id="err" role="alert"></div>
 <details class="panel"><summary id="todaySum">Bản tin hôm nay</summary><div id="todayList"></div></details>
 <div id="usage" class="hint"></div>
</section>

<section id="prefs" class="panel hidden">
 <h3 style="margin-top:0">Nguồn tin</h3><div id="srcList"></div>
 <h3>Chủ đề</h3><div id="catList"></div>
 <div class="row" style="margin:12px 0"><button id="savePrefs" class="primary">LƯU</button><button id="backPrefs">QUAY LẠI</button></div>
 <h3>Thêm nguồn RSS riêng</h3>
 <input id="newUrl" type="url" placeholder="https://…/rss" autocomplete="off" autocapitalize="off"><div style="height:8px"></div>
 <input id="newName" type="text" placeholder="Tên nguồn (tùy chọn)"><div class="row" style="margin-top:10px"><button id="addSrc">THÊM NGUỒN</button></div>
 <p id="prefsMsg" class="hint"></p>
</section>

<section id="admin" class="panel hidden">
 <div class="row" style="justify-content:space-between"><h3 style="margin:0">Quản trị</h3><span class="row"><button id="adminRefresh" class="small">TẢI LẠI</button><button id="adminBack" class="small">QUAY LẠI</button></span></div>
 <div id="adminBody" class="hint">Đang tải…</div>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), CLIENT="__GOOGLE_CLIENT_ID__";
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const load=(k,d)=>{try{return localStorage.getItem(k)||d}catch{return d}}, save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let style=load("nmh_news_style","danh_da"), history=[], active=false, gen=0, rec=null, heard="", noSpeech=0, audioCtx=null, audioSrc=null, ttsGen=0, today=null;
const labels={idle:"Chưa bắt đầu",listening:"Đang nghe…",thinking:"Đang nghĩ…",speaking:"Đang nói…",paused:"Tạm dừng"};
function setState(s,extra){const av=$("avatar");if(av)av.className="avatar st-"+(s==="paused"?"idle":s);$("status").textContent=labels[s]+(extra?" — "+extra:"");$("start").classList.toggle("hidden",active);$("stop").classList.toggle("hidden",!active);$("interrupt").classList.toggle("hidden",!(active&&s==="speaking"));$("resume").classList.toggle("hidden",!(active&&s==="paused"))}
let isAdminUser=false;function show(view){for(const v of ["login","talk","prefs","admin"])$(v).classList.toggle("hidden",v!==view);const inApp=view!=="login";$("prefsBtn").classList.toggle("hidden",!inApp||view!=="talk");$("adminBtn").classList.toggle("hidden",!inApp||view!=="talk"||!isAdminUser);$("logoutBtn").classList.toggle("hidden",!inApp)}
async function api(path,body){const r=await fetch(path,body===undefined?{cache:"no-store"}:{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),cache:"no-store"});const d=await r.json().catch(()=>({error:"HTTP "+r.status}));if(!r.ok)throw Object.assign(Error(d.error||("HTTP "+r.status)),{status:r.status});return d}
function render(){const e=$("history");e.replaceChildren();if(!history.length){const p=document.createElement("p");p.className="hint";p.textContent="Nhấn NÓI rồi hỏi, ví dụ: \"Hôm nay có tin gì về AI?\"";e.append(p)}for(const m of history){const d=document.createElement("div");d.className="b "+m.role;d.textContent=m.content;e.append(d)}e.scrollTop=e.scrollHeight}
function styleUI(){document.querySelectorAll("[data-style]").forEach(b=>{b.classList.toggle("sel",b.dataset.style===style);b.setAttribute("aria-pressed",String(b.dataset.style===style))})}
document.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{style=b.dataset.style;save("nmh_news_style",style);styleUI()});

// ---- Âm thanh (mở khóa trong thao tác chạm, như Ngố) ----
function unlock(){const C=window.AudioContext||window.webkitAudioContext;if(!audioCtx)audioCtx=new C();if(audioCtx.state!=="running")audioCtx.resume().catch(()=>{});const s=audioCtx.createBufferSource();s.buffer=audioCtx.createBuffer(1,1,22050);s.connect(audioCtx.destination);s.start(0)}
let analyser=null,mouthRaf=0;function mouthLoop(){if(!analyser)return;const d=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(d);let s=0;for(const v of d){const x=(v-128)/128;s+=x*x}const lvl=Math.min(1,Math.sqrt(s/d.length)*5);const m=$("avMouth");if(m){const h=4+lvl*22;m.setAttribute("height",h.toFixed(1));m.setAttribute("y",(122-h/2).toFixed(1));m.setAttribute("rx",Math.min(12,h/2).toFixed(1))}mouthRaf=requestAnimationFrame(mouthLoop)}
function mouthStop(){cancelAnimationFrame(mouthRaf);const m=$("avMouth");if(m){m.setAttribute("height","4");m.setAttribute("y","120");m.setAttribute("rx","2")}}
function stopAudio(){mouthStop();ttsGen++;if(audioSrc){audioSrc.onended=null;try{audioSrc.stop()}catch{}audioSrc=null}}
function parts(text){const out=[];for(let s of (String(text).match(/[^.!?…]+[.!?…]*/g)||[text])){s=s.trim();while(s.length>400){let at=s.lastIndexOf(",",400);if(at<150)at=s.lastIndexOf(" ",400);out.push(s.slice(0,at+1).trim());s=s.slice(at+1).trim()}if(s)out.push(s)}
 const merged=[];for(const p of out){if(merged.length&&(merged.at(-1)+" "+p).length<=220)merged[merged.length-1]+=" "+p;else merged.push(p)}return merged}
async function fetchTts(text){const r=await fetch("/api/tts",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text,style}),cache:"no-store"});const d=await r.json().catch(()=>({}));if(!r.ok||!d.audioContent)throw Error(d.error||("HTTP "+r.status));const bin=atob(d.audioContent),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return {buf:bytes.buffer,rate:Number(r.headers.get("x-playback-rate"))||1}}
function play(item){return new Promise(async(resolve,reject)=>{try{if(audioCtx.state!=="running")await audioCtx.resume();const decoded=await audioCtx.decodeAudioData(item.buf.slice(0));const s=audioCtx.createBufferSource();s.buffer=decoded;s.playbackRate.value=item.rate;if(!analyser){analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.connect(audioCtx.destination)}s.connect(analyser);audioSrc=s;s.onended=()=>{if(audioSrc===s)audioSrc=null;mouthStop();resolve()};s.start(0);cancelAnimationFrame(mouthRaf);mouthLoop()}catch(e){reject(e)}})}
async function speak(text,g){stopAudio();const my=++ttsGen,ps=parts(text);setState("speaking");let next=fetchTts(ps[0]).then(v=>({v}),e=>({e}));
 for(let i=0;i<ps.length;i++){const got=await next;if(my!==ttsGen||g!==gen)return;if(got.e){showErr("Giọng đọc lỗi: "+got.e.message);break}next=i+1<ps.length?fetchTts(ps[i+1]).then(v=>({v}),e=>({e})):null;try{await play(got.v)}catch(e){showErr("Không phát được âm thanh: "+e.message);break}if(my!==ttsGen||g!==gen)return}
 if(active&&g===gen)listen();else if(!active&&my===ttsGen)setState("idle")}

// ---- Nghe (Safari SpeechRecognition, như Ngố) ----
function closeRec(){if(rec){const r=rec;rec=null;r.onresult=r.onerror=r.onend=null;try{r.abort()}catch{}}}
function showErr(m){$("err").textContent=m;if(active)setState("paused")}
function listen(){if(!active)return;if(!SR){showErr("Trình duyệt không hỗ trợ nhận giọng. Hãy gõ câu hỏi.");return}closeRec();heard="";const g=gen,r=new SR();rec=r;r.lang="vi-VN";r.continuous=false;r.interimResults=true;
 r.onresult=e=>{let f="",i="";for(const x of e.results){const t=x[0]?.transcript||"";if(x.isFinal)f+=t;else i+=t}heard=(f||i).trim();setState("listening",heard.slice(-60))};
 r.onerror=e=>{if(rec!==r||e.error==="no-speech")return;closeRec();showErr("Micro: "+(e.error||"lỗi")+". Nhấn TIẾP TỤC.")};
 r.onend=()=>{if(rec!==r)return;rec=null;if(!active||g!==gen)return;const t=heard.trim();if(!t){if(++noSpeech<=2)return listen();setState("paused");$("err").textContent="Không nghe thấy gì. Nhấn TIẾP TỤC.";return}noSpeech=0;void askQ(t,g)};
 try{r.start();setState("listening");$("err").textContent=""}catch(e){showErr("Không mở được micro: "+e.message)}}
async function askQ(text,g){setState("thinking");history.push({role:"user",content:text});render();
 try{const d=await api("/api/ask",{messages:history.slice(-10),style});if(g!==gen)return;history.push({role:"assistant",content:d.answer});render();refreshUsage();if(active)await speak(d.answer,g);else{unlockSpeakOnce(d.answer)}}
 catch(e){if(g===gen){if(e.status===401)return boot();showErr("Lỗi: "+e.message);sayError(e.message,g)}}}
// Lỗi thì nhân vật nói ra (không im lặng), nói xong tạm dừng, không tự nghe lại.
async function sayError(msg,g){if(!audioCtx)return;try{const item=await fetchTts(String(msg).slice(0,300));if(g!==gen)return;const was=active;active=false;setState("speaking");await play(item);active=was;if(g===gen)setState("paused")}catch{}}
function unlockSpeakOnce(text){/* câu gõ tay ngoài phiên nói: vẫn đọc nếu âm thanh đã mở khóa */if(audioCtx)speak(text,gen)}

$("start").onclick=()=>{try{unlock()}catch{}active=true;gen++;noSpeech=0;$("err").textContent="";listen()};
$("stop").onclick=()=>{active=false;gen++;closeRec();stopAudio();setState("idle")};
$("interrupt").onclick=()=>{stopAudio();gen++;listen()};
$("resume").onclick=()=>{try{unlock()}catch{}gen++;$("err").textContent="";listen()};
$("typeForm").onsubmit=e=>{e.preventDefault();const t=$("typeIn").value.trim();if(!t)return;$("typeIn").value="";try{unlock()}catch{}closeRec();stopAudio();gen++;void askQ(t,gen)};

// ---- Bản tin, chi phí, cài đặt ----
async function loadToday(){today=await api("/api/today");$("todaySum").textContent="Bản tin của anh: "+today.articles.length+" bài"+(today.lastRun?.finished_at?" · cập nhật "+new Date(today.lastRun.finished_at).toLocaleString("vi-VN"):"");const L=$("todayList");L.replaceChildren();
 for(const a of today.articles){const d=document.createElement("div");d.className="art";const t=document.createElement("a");t.href=a.url;t.target="_blank";t.rel="noopener noreferrer";t.textContent=a.title_vi;const s=document.createElement("div");s.className="src";s.textContent=a.source+" · "+a.category+" · mức "+a.importance;const p=document.createElement("div");p.textContent=a.summary_vi;d.append(t,s,p);L.append(d)}showUsage(today.usageToday)}
function showUsage(u){$("usage").textContent=u?"Ước phí hôm nay (chưa phải hóa đơn): "+Number(u.est_usd).toFixed(4)+" USD · "+u.questions+" câu hỏi · "+u.tts_chars+" ký tự giọng đọc"+(u.web_searches?" · "+u.web_searches+" lần tra web":""):"Hôm nay chưa phát sinh chi phí hỏi đáp."}
async function refreshUsage(){try{const d=await api("/api/today");today=d;showUsage(d.usageToday)}catch{}}
function prefsUI(){const S=$("srcList"),C=$("catList");S.replaceChildren();C.replaceChildren();
 for(const s of today.sources){const l=document.createElement("label");l.className="ck";const i=document.createElement("input");i.type="checkbox";i.value=s.id;i.checked=today.chosenSources.includes(s.id);const sp=document.createElement("span");sp.textContent=s.name+(s.created_by?" (nguồn riêng)":"")+(s.last_error?" ⚠":"");l.append(i,sp);S.append(l)}
 for(const c of today.categories){const l=document.createElement("label");l.className="ck";const i=document.createElement("input");i.type="checkbox";i.value=c;i.checked=today.chosenCategories.includes(c);const sp=document.createElement("span");sp.textContent=c;l.append(i,sp);C.append(l)}}
$("prefsBtn").onclick=async()=>{if(active)$("stop").onclick();await loadToday();prefsUI();$("prefsMsg").textContent="";show("prefs")};
$("backPrefs").onclick=()=>show("talk");
$("savePrefs").onclick=async()=>{const s=[...$("srcList").querySelectorAll("input:checked")].map(i=>i.value),c=[...$("catList").querySelectorAll("input:checked")].map(i=>i.value);try{await api("/api/prefs",{sources:s,categories:c});await loadToday();$("prefsMsg").textContent="Đã lưu.";show("talk")}catch(e){$("prefsMsg").textContent="Lỗi: "+e.message}};
$("addSrc").onclick=async()=>{$("prefsMsg").textContent="Đang kiểm tra nguồn…";try{const d=await api("/api/sources",{url:$("newUrl").value,name:$("newName").value});$("prefsMsg").textContent="Đã thêm "+d.name+". "+d.note;$("newUrl").value="";$("newName").value="";await loadToday();prefsUI()}catch(e){$("prefsMsg").textContent="Không thêm được: "+e.message}};
$("logoutBtn").onclick=async()=>{try{await api("/api/logout",{})}catch{}location.reload()};


// ---- Quản trị ----
const usd=v=>Number(v||0).toFixed(4)+" USD", dt=t=>t?new Date(t).toLocaleString("vi-VN"):"—";
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{}))if(k==="class")e.className=v;else if(k.startsWith("on"))e[k]=v;else e.setAttribute(k,v);for(const c of kids)e.append(c instanceof Node?c:document.createTextNode(String(c??"")));return e}
function kv(...pairs){return el("div",{class:"kv"},...pairs.map(x=>el("span",{},x)))}
function table(head,rows){const t=el("table",{class:"t"});t.append(el("tr",{},...head.map(h=>el("th",{},h))));for(const r of rows)t.append(el("tr",{},...r.map(c=>el("td",{},c))));return t}
async function loadAdmin(){const B=$("adminBody");B.replaceChildren("Đang tải…");try{const d=await api("/api/admin/overview");B.replaceChildren();
 const pct=Math.min(100,d.cost.total_usd/d.target_usd*100);
 B.append(el("h3",{},"Chi phí tháng "+d.month+" (ước tính, chưa phải hóa đơn)"),el("div",{class:"bar"},el("i",{style:"width:"+pct.toFixed(1)+"%;"+(pct>80?"background:#f59e0b":"")})),
