name: NMH Voice - one-time scoped cleanup of experimental search
on:
  push:
    branches: [nmh-voice-gpt-v1]
    paths: ['.github/workflows/nmh-voice-cleanup-experiments.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nmh-voice-gpt-production-deploy
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PROD_VERSION: '8cc6032c-0035-414c-8217-7ea5e91825e5'
      EXPECTED_STAGING_VERSION: '0b8fdbda-b626-4a09-ba35-720483ee9886'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact allowed resources before destructive cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          assert os.environ['CF_TOKEN'] and os.environ['GH_TOKEN'],'Required auth missing'
          account='769c2ab4af5ad50700039d473a72d48e'
          root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/'
          repo='https://api.github.com/repos/hvnm1206/TikTak-Service/git/ref/heads/'
          def query(url,token):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:return r.status,json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code,{}
          status,p=query(root+'nmh-voice-gpt-test/deployments',os.environ['CF_TOKEN'])
          assert status==200 and p.get('success'),'Production deployment preflight failed'
          versions=p['result']['deployments'][0]['versions']
          assert len(versions)==1 and versions[0].get('percentage')==100,'Ambiguous production traffic'
          assert versions[0]['version_id']==os.environ['EXPECTED_PROD_VERSION'],'Production changed unexpectedly: FAIL CLOSED'
          print('PRODUCTION_VERSION=VERIFIED_STABLE')
          status,p=query(root+'nmh-voice-search-lab-v2/deployments',os.environ['CF_TOKEN'])
          if status==200:
              assert p.get('success')
              active=p['result']['deployments'][0]['versions']
              assert len(active)==1 and active[0].get('percentage')==100
              assert active[0]['version_id']==os.environ['EXPECTED_STAGING_VERSION'],'Unrecognized staging version: FAIL CLOSED'
              print('STAGING_VERSION=VERIFIED_EXPERIMENTAL')
          else:
              assert status==404,'Unexpected staging read result '+str(status)
              print('STAGING_ALREADY_GONE=TRUE')
          expected={
            'nmh-voice-search-lab':'24de7f6f2401b1295d61c51c1ed66aab26245cd8',
            'nmh-voice-search-isolated-v2':'0593082f2204dbb89b132e567c35b65adf32b1f2'}
          for branch,sha in expected.items():
              code,p=query(repo+branch,os.environ['GH_TOKEN'])
              assert code==404 or (code==200 and p.get('object',{}).get('sha')==sha),'GitHub branch diverged: '+branch
              print('GITHUB_BRANCH_SCOPED='+branch+' '+('PRESENT' if code==200 else 'ALREADY_GONE'))
          print('CLEANUP_PREFLIGHT=PASS')
          PY
      - name: Delete ONLY separate staging Cloudflare Worker and verify it is gone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ['CF_TOKEN']
          root='https://api.cloudflare.com/client/v4/accounts/769c2ab4af5ad50700039d473a72d48e/workers/scripts/'
          target='nmh-voice-search-lab-v2'
          assert target!='nmh-voice-gpt-test'
          def req(method,url):
              request=urllib.request.Request(url,method=method,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(request,timeout=35) as r:
                      data=r.read()
                      return r.status,json.loads(data) if data else {}
              except urllib.error.HTTPError as e:
                  data=e.read()
                  try:p=json.loads(data)
                  except:p={}
                  return e.code,p
          status,p=req('GET',root+target)
          if status==404:
              print('STAGING_WORKER_ALREADY_ABSENT=PASS')
          else:
              assert status==200 and p.get('success'),'Cannot verify Worker identity before deletion'
              status,p=req('DELETE',root+target+'?force=true')
              assert status in (200,202,204) and p.get('success',True),'Cloudflare staging delete rejected HTTP '+str(status)+' codes '+str([e.get('code') for e in p.get('errors',[])]))
              print('STAGING_WORKER_DELETE=SUCCESS')
          code,_=req('GET',root+target)
          assert code==404,'Staging Worker still exists (HTTP '+str(code)+')'
          prod,p=req('GET',root+'nmh-voice-gpt-test/deployments')
          assert prod==200 and p.get('success'),'Production deployment not readable'
          versions=p['result']['deployments'][0]['versions']
          assert len(versions)==1 and versions[0]['version_id']==os.environ['EXPECTED_PROD_VERSION'],'Production unexpectedly changed'
          print('STAGING_WORKER_ABSENT=VERIFIED')
          print('PRODUCTION_WORKER_VERSION_UNCHANGED=PASS')
          PY
      - name: Remove ONLY two explicitly identified experimental GitHub branch refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,urllib.error,json
          token=os.environ['GH_TOKEN']
          base='https://api.github.com/repos/hvnm1206/TikTak-Service/git/refs/heads/'
          names=['nmh-voice-search-lab','nmh-voice-search-isolated-v2']
          for name in names:
              assert name not in ('main','master','nmh-voice-gpt-v1')
              req=urllib.request.Request(base+name,method='DELETE',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:status=response.status
              except urllib.error.HTTPError as e:
                  status=e.code
              assert status in (200,204,404),'Cannot remove GitHub experimental branch '+name+' HTTP '+str(status)
              verify=urllib.request.Request(base+name,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(verify,timeout=20) as response:code=response.status
              except urllib.error.HTTPError as e:code=e.code
              assert code==404,'Experimental GitHub ref still exists '+name
              print('GITHUB_EXPERIMENTAL_BRANCH_REMOVED='+name)
          PY
      - name: Post-cleanup live safety probe without using API keys
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nmh-voice-gpt-test.magical-budget.workers.dev'
          curl --fail --silent --show-error --max-time 20 "$URL/health" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["ok"] and x["voice"]=="browser-stt+marin-tts" and x["v3Version"]=="d1-only-google-v3";print("PROD_HEALTH=PASS")'
          curl --fail --silent --show-error --max-time 20 "$URL/api/v3/config" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["ready"] and x["storage"]=="Cloudflare D1" and not x["r2Required"];print("PROD_D1_GOOGLE_CONFIG=PASS")'
          curl --fail --silent --show-error --max-time 20 "$URL/" -o /tmp/nmh-prod.html
          grep -q 'id="avatar"' /tmp/nmh-prod.html
          grep -q 'id="start"' /tmp/nmh-prod.html
          grep -q 'id="resume"' /tmp/nmh-prod.html
          ! grep -q 'id="v3WebSearch"' /tmp/nmh-prod.html
          echo 'PROD_MIC_UI_PRESENCE_UNCHANGED=PASS'
          echo 'USER_IPHONE_REAL_AUDIO_E2E=NOT_AUTOMATED'
