name: NGỐ — read-only Google voice probe
on:
  push:
    branches: [nmh-voice-actions-reminders-p0-20261114]
jobs:
  probe:
    if: "${{ startsWith(github.event.head_commit.message, 'probe(ngo): google voice') }}"
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
    steps:
      - name: Free search sources reachable from a datacenter IP (read-only)
        continue-on-error: true
        run: |
          for u in 'https://news.google.com/rss/search?q=tri%E1%BB%83n%20l%C3%A3m%20H%C3%A0%20N%E1%BB%99i&hl=vi&gl=VN&ceid=VN:vi' 'https://vi.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=H%C3%A0%20N%E1%BB%99i&gsrlimit=1&format=json'; do
            for ua in '' 'NMH-Voice/1.0 (ai.nomahub; contact via nomahubvn.com)'; do
              code=$(curl -sS -o /tmp/o -w '%{http_code}' ${ua:+-A "$ua"} -H 'Accept: application/json, application/xml, text/xml;q=0.8' "$u" || echo ERR)
              echo "NGO_SRC code=$code ua=${ua:+custom}${ua:-none} bytes=$(wc -c </tmp/o) url=${u:0:40}"
            done
          done
      - name: Worker invocation analytics (status, CPU time) read-only
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,datetime
          since=(datetime.datetime.utcnow()-datetime.timedelta(hours=3)).strftime('%Y-%m-%dT%H:%M:%SZ')
          q='query($a:String!,$s:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:200,filter:{scriptName:"nmh-voice-gpt-test",datetime_geq:$s},orderBy:[datetimeFifteenMinutes_DESC]){sum{requests errors subrequests} quantiles{cpuTimeP50 cpuTimeP99 wallTimeP99} dimensions{datetimeFifteenMinutes status}}}}}'
          for name in ('A','B'):
            tok=os.environ.get('TOK_'+name)
            req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',data=json.dumps({'query':q,'variables':{'a':os.environ['CLOUDFLARE_ACCOUNT_ID'],'s':since}}).encode(),method='POST',headers={'Authorization':'Bearer '+tok,'Content-Type':'application/json','User-Agent':'NMH-NGO-PROBE'})
            try:
              with urllib.request.urlopen(req,timeout=40) as r:res=json.load(r)
              if res.get('errors'):print('NGO_GQL',name,'errors',json.dumps(res['errors'])[:300]);continue
              rows=res['data']['viewer']['accounts'][0]['workersInvocationsAdaptive']
              for x in rows:print('NGO_GQL',name,x['dimensions']['datetimeFifteenMinutes'],x['dimensions']['status'],'req',x['sum']['requests'],'err',x['sum']['errors'],'cpuP50',x['quantiles']['cpuTimeP50'],'cpuP99',x['quantiles']['cpuTimeP99'],'wallP99',x['quantiles']['wallTimeP99'])
              break
            except urllib.error.HTTPError as e:print('NGO_GQL',name,'HTTP',e.code,e.read()[:200].decode('utf-8','replace'))
          PY
        env:
          TOK_A: ${{ secrets.NMH_CF_API_TOKEN }}
          TOK_B: ${{ secrets.NMH_V3_CF_PROVISION_TOKEN }}
      - name: Workers plan and CPU limits (read-only)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          a='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          for p in ['/workers/account-settings','/workers/scripts/nmh-voice-gpt-test/settings','/workers/scripts/nmh-voice-gpt-test/script-settings','/subscriptions']:
            req=urllib.request.Request(a+p,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'User-Agent':'NMH-NGO-PROBE'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:res=json.load(r)['result']
              if isinstance(res,list):res=[{k:x.get(k) for k in ('rate_plan','component_values','product','state') if k in x} for x in res]
              elif isinstance(res,dict):res={k:v for k,v in res.items() if k in ('default_usage_model','usage_model','limits','placement','observability','compatibility_date','green_compute')}
              print('NGO_PLAN',p,json.dumps(res)[:700])
            except urllib.error.HTTPError as e:print('NGO_PLAN',p,'HTTP',e.code,e.read()[:200].decode('utf-8','replace'))
          PY
      - name: D1 health for the 503 report (read-only, dummy user, no personal rows)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_V3_CF_PROVISION_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,time
          a='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/d1/database/3ce295cb-a84d-4a50-abee-d14fdd903514/query'
          def q(sql,params=None):
            t=time.time();req=urllib.request.Request(a,data=json.dumps({'sql':sql,'params':params or []}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json','User-Agent':'NMH-NGO-PROBE'})
            try:
              with urllib.request.urlopen(req,timeout=40) as r:res=json.load(r)
              rows=(res.get('result') or [{}])[0].get('results',[])
              print('NGO_D1 ok',round((time.time()-t)*1000),'ms',sql[:70],'rows='+str(len(rows)),json.dumps(rows[:40])[:600] if 'sqlite_master' in sql else '')
            except urllib.error.HTTPError as e:print('NGO_D1 HTTP',e.code,sql[:70],e.read()[:300].decode('utf-8','replace'))
          q("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")
          u='probe-nobody'
          q('SELECT prompt FROM v3_profiles WHERE user_id=?',[u])
          q('SELECT body FROM v3_memories WHERE user_id=? ORDER BY created_at DESC LIMIT 40',[u])
          q('SELECT c.body, c.segment, d.name FROM v3_chunks c JOIN v3_documents d ON d.id=c.doc_id AND d.user_id=c.user_id WHERE c.user_id=? AND (c.body LIKE ?) LIMIT 80',[u,'%x%'])
          q('SELECT COUNT(*) n FROM v3_sessions WHERE expires_at>?',[int(time.time()*1000)])
          PY
      - name: Recent Worker logs (read-only, trace lines and 5xx)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request
          a='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          now=int(time.time()*1000)
          body={"queryId":"ngo-probe","timeframe":{"from":now-3*3600*1000,"to":now},"view":"events","limit":60,
                "parameters":{"filters":[{"key":"$workers.scriptName","operation":"eq","type":"string","value":"nmh-voice-gpt-test"}]}}
          req=urllib.request.Request(a+'/workers/observability/telemetry/query',data=json.dumps(body).encode(),method='POST',
            headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json','User-Agent':'NMH-NGO-PROBE'})
          try:
            with urllib.request.urlopen(req,timeout=40) as r:res=json.load(r)
          except urllib.error.HTTPError as e:
            print('NGO_LOGS_HTTP',e.code,e.read()[:400].decode('utf-8','replace'));raise SystemExit(0)
          ev=(res.get('result') or {}).get('events',{}).get('events',[]) or []
          print('NGO_LOGS_COUNT',len(ev))
          for x in ev[:60]:
            md=x.get('$metadata',{});wk=x.get('$workers',{});src=x.get('source')
            msg=md.get('message') or (src if isinstance(src,str) else json.dumps(src)[:300] if src else '')
            print('NGO_LOG',md.get('timestamp') or x.get('timestamp'),wk.get('event',{}).get('request',{}).get('path') if isinstance(wk.get('event'),dict) else '',wk.get('outcome') or md.get('statusCode') or '',str(msg)[:300])
          PY
      - name: Active version and secret names (no values)
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          a='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          def cf(p):
            req=urllib.request.Request(a+p,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'User-Agent':'NMH-NGO-PROBE'})
            with urllib.request.urlopen(req,timeout=35) as r:return json.load(r)['result']
          v=cf('/workers/scripts/nmh-voice-gpt-test/deployments')['deployments'][0]['versions']
          print('NGO_ACTIVE_VERSIONS='+json.dumps([(x['version_id'],x['percentage']) for x in v]))
          try:print('NGO_SECRET_NAMES='+json.dumps(sorted(s['name'] for s in cf('/workers/scripts/nmh-voice-gpt-test/secrets'))))
          except Exception as e:print('NGO_SECRET_NAMES_UNAVAILABLE',e)
          PY
      - name: Probe /api/tts (dummy OpenAI key; Google path only costs a few characters)
        run: |
          U=https://nmh-voice-gpt-test.magical-budget.workers.dev
          for fmt in pcm mp3; do
            code=$(curl -sS -o out.bin -D h.txt -w '%{http_code}' -X POST "$U/api/tts" -H "origin: $U" -H 'content-type: application/json' \
              -d "{\"apiKey\":\"sk-probe$(printf 'x%.0s' $(seq 1 40))\",\"text\":\"Xin chào, đây là giọng thử.\",\"style\":\"danh_da\",\"format\":\"$fmt\"}")
            src=$(grep -i '^x-nmh-tts-source' h.txt | tr -d '\r' | cut -d' ' -f2)
            ct=$(grep -i '^content-type' h.txt | tr -d '\r' | cut -d' ' -f2-)
            echo "NGO_PROBE_$fmt status=$code source=${src:-none} type=$ct bytes=$(stat -c%s out.bin)"
            [ "$code" = 200 ] || head -c 300 out.bin; echo
          done
          LONG='Đi theo tuyến chính qua Phố Nguyễn Cơ Thạch → Hàm Nghi → Lê Đức Thọ → Hồ Tùng Mậu → Phạm Hùng → Đại Lộ Thăng Long → Phố Trần Bình → Phố Tôn Thất Thuyết → Đường Trần Thái Tông, quãng đường khoảng 9 km, mất chừng 17 phút, dự kiến tới lúc 7 giờ 40, có đoạn đông ở Phạm Hùng'
          code=$(curl -sS -o out.bin -D h.txt -w '%{http_code}' -X POST "$U/api/tts" -H "origin: $U" -H 'content-type: application/json' \
            --data-binary "$(python3 -c 'import json,sys;print(json.dumps({"apiKey":"sk-probe"+"x"*40,"text":sys.argv[1],"style":"danh_da","format":"pcm"}))' "$LONG")")
          echo "NGO_PROBE_long status=$code source=$(grep -i '^x-nmh-tts-source' h.txt | tr -d '\r' | cut -d' ' -f2) google_error=$(grep -i '^x-nmh-tts-google-error' h.txt | tr -d '\r' | cut -d' ' -f2-) bytes=$(stat -c%s out.bin)"
