name: NGỐ — read-only Tavily feasibility probe
# 20/11/2026 owner chose a cheaper search provider (Tavily, 1,000 free credits/month) to replace OpenAI web_search.
# Read-only: 20 Vietnamese questions, 1 basic credit each. Does NOT touch the Worker, D1 or production.
on:
  push:
    branches: [nmh-voice-actions-reminders-p0-20261114]
jobs:
  probe:
    if: "${{ startsWith(github.event.head_commit.message, 'probe(ngo): tavily') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Tavily Vietnamese search quality, latency and parse cost
        env:
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
        run: |
          if [ -z "$TAVILY_KEY" ]; then echo "NGO_TAVILY key=MISSING"; exit 1; fi
          echo "NGO_TAVILY key=present"
          cat > /tmp/probe.mjs <<'JS'
          const qs=[["Giá xăng RON 95 kỳ điều chỉnh mới nhất","week"],["Chủ tịch UBND thành phố Hà Nội hiện nay là ai","month"],["Thời tiết Hà Nội cuối tuần này","day"],["Kết quả trận gần nhất của đội tuyển bóng đá Việt Nam","month"],["Giá vàng SJC hôm nay","day"],["Tin tức OpenAI mới nhất","week"]];
          const key=process.env.TAVILY_KEY;
          for(const [q,tr] of qs)for(const topic of ["general","news"]){
            const body={query:q,search_depth:"basic",max_results:5,include_answer:false,topic,time_range:tr,...(topic==="general"?{country:"vietnam"}:{})};
            const t0=Date.now();const r=await fetch("https://api.tavily.com/search",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify(body)});
            const ms=Date.now()-t0,txt=await r.text();
            if(!r.ok){console.log("NGO_FRESH q="+JSON.stringify(q)+" topic="+topic+" range="+tr+" http="+r.status+" err="+txt.replace(/\s+/g," ").slice(0,200));continue}
            const j=JSON.parse(txt),res=j.results||[];
            console.log("NGO_FRESH q="+JSON.stringify(q)+" topic="+topic+" range="+tr+" http=200 ms="+ms+" results="+res.length+" with_date="+res.filter(x=>x.published_date).length);
            for(const x of res.slice(0,3)){let d="";try{d=new URL(x.url).hostname}catch{}console.log("   - ["+(x.published_date||"no-date")+"] "+d+" | "+String(x.title||"").replace(/\s+/g," ").slice(0,90)+" | "+String(x.content||"").replace(/\s+/g," ").slice(0,140))}
          }
          JS
          node /tmp/probe.mjs
