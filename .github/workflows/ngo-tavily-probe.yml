name: NGỐ — read-only Tavily feasibility probe
# 20/11/2026 owner chose a cheaper search provider (Tavily, 1,000 free credits/month) to replace OpenAI web_search.
# Read-only: 20 Vietnamese questions, 1 basic credit each. Does NOT touch the Worker, D1 or production.
on:
  push:
    branches: [nmh-voice-actions-reminders-p0-20261114]
jobs:
  probe:
    if: "${{ startsWith(github.event.head_commit.message, 'probe(ngo): tavily') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Tavily Vietnamese search quality, latency and parse cost
        env:
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
        run: |
          if [ -z "$TAVILY_KEY" ]; then echo "NGO_TAVILY key=MISSING"; exit 1; fi
          echo "NGO_TAVILY key=present"
          cat > /tmp/probe.mjs <<'JS'
          const qs=[
           "Giá vàng SJC hôm nay","Tỷ giá đô la Mỹ hôm nay Vietcombank","Giá xăng RON 95 kỳ điều chỉnh mới nhất",
           "Tin tức Hà Nội hôm nay","Kết quả trận gần nhất của đội tuyển bóng đá Việt Nam","Lịch nghỉ Tết Nguyên đán 2027",
           "Quán phở ngon gần Hồ Gươm","Giá iPhone mới nhất tại Việt Nam","Chủ tịch UBND thành phố Hà Nội hiện nay là ai",
           "Tiến độ đường Vành đai 4 Hà Nội","Phim chiếu rạp tuần này ở Việt Nam","Giá cổ phiếu VNM hôm nay",
           "Mức phạt nồng độ cồn khi lái ô tô hiện nay","Giá cửa nhôm Xingfa bao nhiêu một mét vuông","Tin tức OpenAI mới nhất",
           "Giá vé máy bay Hà Nội Đà Nẵng tuần này","Giờ mở cửa Lăng Chủ tịch Hồ Chí Minh","Thủ tục đổi giấy phép lái xe",
           "Đặt lịch khám bệnh viện Bạch Mai online","Thời tiết Hà Nội cuối tuần này"];
          const key=process.env.TAVILY_KEY;let ok=0,lat=[];
          for(const q of qs){
            const body={query:q,search_depth:"basic",max_results:5,include_answer:false,country:"vietnam"};
            const t0=Date.now();let r=await fetch("https://api.tavily.com/search",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify(body)});
            let note="";if(r.status===400){delete body.country;note=" (retry no country)";r=await fetch("https://api.tavily.com/search",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify(body)})}
            const ms=Date.now()-t0;const txt=await r.text();
            if(!r.ok){console.log("NGO_TAVILY q="+JSON.stringify(q)+" http="+r.status+" ms="+ms+note+" err="+txt.replace(/\s+/g," ").slice(0,160));continue}
            const p0=performance.now();const j=JSON.parse(txt);const trimmed=(j.results||[]).slice(0,5).map(x=>({title:String(x.title||"").slice(0,120),url:x.url,content:String(x.content||"").slice(0,500)}));const parseMs=(performance.now()-p0).toFixed(2);
            ok++;lat.push(ms);
            console.log("NGO_TAVILY q="+JSON.stringify(q)+" http=200 ms="+ms+note+" results="+trimmed.length+" bytes="+txt.length+" parse_ms="+parseMs+" credits="+(j.usage?.credits??"n/a"));
            for(const x of trimmed.slice(0,3)){let d="";try{d=new URL(x.url).hostname}catch{}console.log("   - "+d+" | "+x.title.replace(/\s+/g," ")+" | "+x.content.replace(/\s+/g," ").slice(0,220))}
          }
          lat.sort((a,b)=>a-b);
          console.log("NGO_TAVILY_SUMMARY ok="+ok+"/"+qs.length+" latency_p50_ms="+lat[Math.floor(lat.length/2)]+" latency_max_ms="+lat.at(-1));
          JS
          node /tmp/probe.mjs
