name: NMH Memory V2 production baseline audit - READ ONLY
on:
  push:
    branches: [nmh-voice-memory-v2-stage-20261114]
permissions:
  contents: read
jobs:
  baseline:
    if: >-
      startsWith(github.event.head_commit.message, 'audit(memory-v2): production read-only baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.NMH_V3_CF_PROVISION_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
    steps:
      - name: Verify live Worker, D1 identity and data aggregates without writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_D1_TOKEN"
          python3 - <<'PY'
          import os,json,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          api='https://api.cloudflare.com/client/v4/accounts/'+account
          def http(url,token=None,body=None):
           headers={'User-Agent':'NMH-Memory-Baseline/1'}
           if token:headers['Authorization']='Bearer '+token
           if body is not None:headers['Content-Type']='application/json'
           req=urllib.request.Request(url,data=json.dumps(body).encode() if body else None,headers=headers,method='POST' if body else 'GET')
           with urllib.request.urlopen(req,timeout=25) as r:return json.load(r)
          deployment=http(api+'/workers/scripts/nmh-voice-gpt-test/deployments',os.environ['CLOUDFLARE_API_TOKEN'])
          assert deployment.get('success') is True
          versions=deployment['result']['deployments'][0]['versions']
          assert len(versions)==1 and versions[0]['percentage']==100
          actual=versions[0]['version_id']
          assert actual=='fb2bacc5-b26e-4abc-9ee1-78cc222ac221','Production version drift: no release'
          d1='3ce295cb-a84d-4a50-abee-d14fdd903514'
          url=api+'/d1/database/'+d1+'/query'
          queries={
            'users':'SELECT COUNT(*) AS n FROM v3_users',
            'sessions':'SELECT COUNT(*) AS n FROM v3_sessions',
            'memories':'SELECT COUNT(*) AS n FROM v3_memories',
            'documents':'SELECT COUNT(*) AS n FROM v3_documents',
            'memory_v2_opted_in':'SELECT COUNT(*) AS n FROM v3_memory_v2_preferences WHERE enabled=1',
            'memory_v2_turns':'SELECT COUNT(*) AS n FROM v3_memory_v2_turns',
            'note_files':'SELECT COUNT(*) AS n FROM v3_documents WHERE name=\'GHI_CHU.md\'',
            'note_segments':'SELECT COALESCE(SUM(segment_count),0) AS n FROM v3_documents WHERE name=\'GHI_CHU.md\'',
            'note_chunks':'SELECT COUNT(*) AS n FROM v3_chunks WHERE doc_id IN (SELECT id FROM v3_documents WHERE name=\'GHI_CHU.md\')',
            'recent_memories':'SELECT COUNT(*) AS n FROM v3_memories WHERE created_at > 1794636000000',
            'last_memory_written_ms':'SELECT COALESCE(MAX(created_at),0) AS n FROM v3_memories',
            'last_memory_v2_written_ms':'SELECT COALESCE(MAX(created_at),0) AS n FROM v3_memory_v2_turns',
            'last_note_created_ms':"SELECT COALESCE(MAX(created_at),0) AS n FROM v3_documents WHERE name='GHI_CHU.md'",
            'memory_records_today_utc':"SELECT COUNT(*) AS n FROM v3_memories WHERE created_at >= (strftime('%s','now','start of day')*1000)",
            'memory_records_last_30min':"SELECT COUNT(*) AS n FROM v3_memories WHERE created_at >= ((strftime('%s','now')-1800)*1000)",

          }
          for key,sql in queries.items():
           reply=http(url,os.environ['CLOUDFLARE_D1_TOKEN'],{'sql':sql,'params':[]})
           assert reply.get('success') and reply['result'][0].get('success') is True
           n=reply['result'][0]['results'][0]['n']
           assert isinstance(n,int) and n>=0
           print('PRODUCTION_AGGREGATE_'+key.upper()+'='+str(n))
          base='https://nmh-voice-gpt-test.magical-budget.workers.dev'
          health=http(base+'/health');cfg=http(base+'/api/v3/config')
          assert health.get('ok') and health.get('voice')=='browser-stt+marin-tts' and health.get('v3Version')=='d1-only-google-v3'
          assert cfg.get('ready') and cfg.get('storage')=='Cloudflare D1'
          print('PRODUCTION_ACTIVE_VERSION='+actual)
          print('PRODUCTION_MEMORY_V2_BASELINE_READONLY=PASS')
          PY

# No D1 writes, no Worker deployment, no Ngáo access.

# Live counts audit, no personal data read or modified.

# Repeat read-only document segment audit; no personal contents retrieved.

