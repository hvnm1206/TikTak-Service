name: NMH Traffic V1 - credential presence audit (no mutation)
on:
  push:
    branches: [nmh-traffic-voice-v1-20261114]
    paths: ['.github/workflows/traffic-voice-credential-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NMH_CF_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
      OTHER_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      MAPS_NMH_KEY: ${{ secrets.NMH_GOOGLE_MAPS_API_KEY }}
      MAPS_GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AI_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_NMH_KEY: ${{ secrets.NMH_OPENAI_API_KEY }}
      TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_ACCESS_TOKEN }}
    steps:
      - name: Report only credential availability flags
        shell: bash
        run: |
          set -euo pipefail
          report() {
            local n="$1" v="$2"
            if [[ -n "$v" ]]; then echo "${n}=CONFIGURED"; else echo "${n}=ABSENT"; fi
          }
          report CF_NMH "$NMH_CF_TOKEN"
          report CF_STANDARD "$OTHER_CF_TOKEN"
          report GOOGLE_MAPS "$MAPS_KEY"
          report GOOGLE_MAPS_NMH "$MAPS_NMH_KEY"
          report GOOGLE_GENERAL "$MAPS_GOOGLE_KEY"
          report OPENAI "$AI_KEY"
          report OPENAI_NMH "$AI_NMH_KEY"
          report TRAFFIC_ACCESS "$TRAFFIC_TOKEN"
      - name: Verify Cloudflare token account scope read-only
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${NMH_CF_TOKEN:-${OTHER_CF_TOKEN:-}}"
          if [[ -z "$TOKEN" ]]; then echo "CLOUDFLARE_ACCOUNT_READ=NO_TOKEN"; exit 0; fi
          response=$(curl -sS -m 15 -o /tmp/cf-audit.json -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" 'https://api.cloudflare.com/client/v4/accounts/769c2ab4af5ad50700039d473a72d48e/workers/scripts' || true)
          if [[ "$response" == "200" ]]; then
            python3 -c 'import json; d=json.load(open("/tmp/cf-audit.json")); assert d.get("success"); names={i.get("id") for i in (d.get("result") or []) if isinstance(i,dict)}; print("CLOUDFLARE_ACCOUNT_READ=READY"); print("TRAFFIC_WORKER_EXISTS="+("YES" if "nmh-traffic-voice-v1" in names else "NO")); print("EXISTING_NGO_VISIBLE="+("YES" if "nmh-voice-gpt-test" in names else "NO"))' || echo "CLOUDFLARE_ACCOUNT_READ=DENIED_OR_UNAVAILABLE"
          else
            echo "CLOUDFLARE_ACCOUNT_READ=DENIED_OR_UNAVAILABLE"
          fi
