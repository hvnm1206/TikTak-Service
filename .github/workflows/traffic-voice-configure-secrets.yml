name: NMH Traffic V1 - gated backend credentials installation
on:
  push:
    branches: [nmh-traffic-voice-v1-20261114]
    paths: ['.github/workflows/traffic-voice-configure-secrets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-traffic-credentials-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
      TRAFFIC_GOOGLE_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      TRAFFIC_AI_KEY: ${{ secrets.OPENAI_API_KEY }}
      TRAFFIC_PASS: ${{ secrets.TRAFFIC_ACCESS_TOKEN }}
      TRAFFIC_MAP_BROWSER_KEY: ${{ secrets.MAPS_BROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm all required keys are configured before any mutation
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$TRAFFIC_GOOGLE_KEY" || -z "$TRAFFIC_AI_KEY" || ${#TRAFFIC_PASS} -lt 16 ]]; then
            echo "BACKEND_KEYS_NOT_READY=NO_CHANGES"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "BACKEND_KEYS_PRESENT=YES_VALUES_NOT_LOGGED"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Verify target Worker identity before secret writes
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail -sS --max-time 15 'https://nmh-traffic-voice-v1.magical-budget.workers.dev/health' -o /tmp/traffic-prior-health.json
          python3 -c 'import json; d=json.load(open("/tmp/traffic-prior-health.json")); assert d.get("app")=="NMH Traffic Voice V1" and d.get("version")=="traffic-v1.0", "REFUSE_WRONG_DEPLOY_TARGET";print("TRAFFIC_TARGET_IDENTITY=VERIFIED")'
      - name: Install required secrets to Traffic Worker only
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TRAFFIC_GOOGLE_KEY" | npx --yes wrangler@4.102.0 secret put GOOGLE_MAPS_API_KEY --config traffic-voice/wrangler.jsonc
          printf '%s' "$TRAFFIC_AI_KEY" | npx --yes wrangler@4.102.0 secret put OPENAI_API_KEY --config traffic-voice/wrangler.jsonc
          printf '%s' "$TRAFFIC_PASS" | npx --yes wrangler@4.102.0 secret put TRAFFIC_ACCESS_TOKEN --config traffic-voice/wrangler.jsonc
          if [[ -n "$TRAFFIC_MAP_BROWSER_KEY" ]]; then
            printf '%s' "$TRAFFIC_MAP_BROWSER_KEY" | npx --yes wrangler@4.102.0 secret put MAPS_BROWSER_KEY --config traffic-voice/wrangler.jsonc
          fi
      - name: Verify secret presence and unaffected Ngố
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail -sS --max-time 15 'https://nmh-traffic-voice-v1.magical-budget.workers.dev/health' -o /tmp/traffic-health.json
          python3 -c 'import json;d=json.load(open("/tmp/traffic-health.json")); assert d.get("ok") and d.get("app")=="NMH Traffic Voice V1" and d.get("mapsConfigured") and d.get("aiConfigured") and d.get("accessConfigured") and d.get("rateLimiterConfigured"); print("TRAFFIC_BACKEND_CONFIG=READY")'
          curl --fail -sS --max-time 15 'https://nmh-voice-gpt-test.magical-budget.workers.dev/health' -o /tmp/ngo-health.json
          python3 -c 'import json;d=json.load(open("/tmp/ngo-health.json")); assert d.get("ok") and d.get("app")=="NMH Voice GPT V2";print("NGO_HEALTH_UNCHANGED=PASS")'
