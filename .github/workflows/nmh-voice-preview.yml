name: NMH Voice GPT — verify and guarded production deploy
on:
  push:
    branches: [nmh-voice-gpt-v1]
  workflow_dispatch:
    inputs:
      deploy_live:
        description: 'Deploy to verified Magical Budget Worker (requires rollback readiness)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check voice-deploy/worker.js
          node --check voice-deploy/agent-v2.js
      - name: Test assistant, tools, TTS and Voice UI
        run: |
          node --test voice-deploy/agent-v2.test.mjs voice-deploy/worker-v2.test.mjs
      - name: Verify V3 staged backend syntax and isolated account tests
        run: |
          node --check voice-deploy/v3-backend.js
          node --check voice-deploy/v3-ui.js
          node --test voice-deploy/v3-backend.test.mjs
      - name: Validate V3 SQLite migration and guarded workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3,pathlib
          s=pathlib.Path('voice-deploy/migrations/0001_v3.sql').read_text()
          db=sqlite3.connect(':memory:');db.executescript(s)
          db.executescript(pathlib.Path('voice-deploy/migrations/0002_v3_d1_only.sql').read_text())
          assert any(c[1]=='raw_text' for c in db.execute('PRAGMA table_info(v3_documents)').fetchall())
          for table in ['v3_users','v3_sessions','v3_profiles','v3_memories','v3_documents','v3_chunks']:
              assert db.execute('SELECT count(*) FROM sqlite_master WHERE type=? AND name=?',('table',table)).fetchone()[0]==1,table
          print('V3_D1_SCHEMA_SQLITE=PASS')
          PY
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/nmh-voice-v3-provision.yml'); YAML.parse_file('.github/workflows/nmh-voice-v3-release.yml'); puts 'V3_WORKFLOW_YAML=PASS'"
      - name: Check Cloudflare CI readiness without deploying or revealing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_API_TOKEN=NOT_CONFIGURED"
            exit 0
          fi
          if [[ "${CLOUDFLARE_ACCOUNT_ID}" != "769c2ab4af5ad50700039d473a72d48e" ]]; then
            echo "CLOUDFLARE_ACCOUNT=WRONG_TARGET"
            exit 0
          fi
          if ! curl --silent --show-error --max-time 12 --output /tmp/cf-token-verify.json -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" https://api.cloudflare.com/client/v4/user/tokens/verify; then
            echo "CLOUDFLARE_TOKEN=VERIFY_NETWORK_ERROR"
            exit 0
          fi
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/cf-token-verify.json'))
              status=d.get('result',{}).get('status','unknown')
              print('CLOUDFLARE_TOKEN='+('ACTIVE' if d.get('success') and status=='active' else 'NOT_VERIFIED'))
          except Exception:
              print('CLOUDFLARE_TOKEN=INVALID_RESPONSE')
          PY
          curl --silent --show-error --max-time 15 --output /tmp/nmh-voice-deployments.json \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/nmh-voice-gpt-test/deployments"
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/nmh-voice-deployments.json'))
              items=d.get('result',{}).get('deployments',[]) if isinstance(d.get('result'),dict) else []
              print('CLOUDFLARE_DEPLOYMENTS='+('READ_OK' if d.get('success') and items else 'NOT_VERIFIED'))
              if items:
                  current=items[0]
                  versions=current.get('versions') or []
                  version=versions[0].get('version_id','') if versions else ''
                  print('ACTIVE_VERSION_ID='+version)
                  print('DEPLOYMENT_ID='+str(current.get('id','')))
          except Exception:
              print('CLOUDFLARE_DEPLOYMENTS=INVALID_RESPONSE')
          PY



  deploy:
    needs: verify
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_live == true) ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(voice): V2 approved'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nmh-voice-gpt-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safeguard Cloudflare current production version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Missing token"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/nmh-voice-gpt-test/deployments" \
            -o /tmp/cf-current.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/cf-current.json'))
          assert data.get('success'), 'Cloudflare API not authorized'
          items=data.get('result',{}).get('deployments',[])
          assert items and items[0].get('versions'), 'No active Worker deployment to rollback'
          vs=items[0]['versions']
          assert len(vs)==1 and vs[0].get('percentage')==100, 'Production split deployment: require manual review'
          version=vs[0]['version_id']
          assert __import__('re').fullmatch(r'[0-9a-f-]{36}', version), 'Invalid active Cloudflare version; refuse deploy'
          with open(os.environ['GITHUB_ENV'],'a') as h: h.write('NMH_STABLE_VERSION='+version+'\n')
          print('VERIFIED_STABLE_VERSION='+version)
          print('VERIFIED_DEPLOYMENT_ID='+str(items[0].get('id','')))
          PY
          # Runtime identity must still be the expected healthy NMH Voice instance before capturing rollback.
          curl --fail --silent --show-error --max-time 15 'https://nmh-voice-gpt-test.magical-budget.workers.dev/health' -o /tmp/nmh-predeploy-health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/nmh-predeploy-health.json'))
          assert h.get('ok') is True and h.get('version')=='v2-tts-audioctx' and h.get('voice')=='browser-stt+marin-tts', 'Unexpected production identity; refuse deploy'
          print('ROLLBACK_BASELINE=HEALTH_VERIFIED')
          PY
      - name: Deploy V2 to SAME Worker with automatic rollback on failed smoke checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
        shell: bash
        run: |
          set -Eeuo pipefail
          rollback() {
            echo "::error::V2 deploy or smoke test failed; attempt rollback to ${NMH_STABLE_VERSION}"
            npx --yes wrangler@4.102.0 rollback "${NMH_STABLE_VERSION}" --name nmh-voice-gpt-test --message "Automatic rollback after NMH Voice V2 failure" --config voice-deploy/wrangler.jsonc || echo "::error::AUTOMATIC_ROLLBACK_FAILED"
          }
          trap rollback ERR
          npx --yes wrangler@4.102.0 deploy --config voice-deploy/wrangler.jsonc
          TARGET="https://nmh-voice-gpt-test.magical-budget.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            if curl --fail --silent --show-error --max-time 15 "${TARGET}/health" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("version")=="v2-tts-audioctx"'; then
              echo "DEPLOY_HEALTH=V2_OK"
              break
            fi
            if [[ "${attempt}" == 6 ]]; then
              echo "::error::Health failed"
              false
            fi
          done
          curl --fail --silent --show-error --max-time 15 "${TARGET}/health" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d.get("uiVersion")=="presence-canvas-v1"'
          curl --fail --silent --show-error --max-time 15 "${TARGET}/" -o /tmp/nmh-v2-page.html
          grep -q 'styleDanh' /tmp/nmh-v2-page.html || { echo "::error::V2 persona UI missing"; false; }
          grep -q 'testVoice' /tmp/nmh-v2-page.html || { echo "::error::Marin diagnostic control missing"; false; }
          grep -q 'AUDIO_DECODE_FAILED' /tmp/nmh-v2-page.html || { echo "::error::New AudioContext engine missing"; false; }
          grep -q 'usageSummary' /tmp/nmh-v2-page.html || { echo "::error::Cost usage UI missing"; false; }
          grep -q 'id="avatar"' /tmp/nmh-v2-page.html || { echo "::error::Face Canvas not found"; false; }
          grep -q 'class PresenceFace' /tmp/nmh-v2-page.html || { echo "::error::Face engine not found"; false; }
          grep -q 'id="journalBtn"' /tmp/nmh-v2-page.html || { echo "::error::Transcript drawer not found"; false; }
          grep -q 'getByteTimeDomainData' /tmp/nmh-v2-page.html || { echo "::error::Actual audio visualizer not found"; false; }
          echo "DEPLOY_UI=PRESENCE_CANVAS_OK"
          curl --fail --silent --show-error --max-time 20 "${TARGET}/api/docs/handover" -o /tmp/nmh-v2-handover.md
          grep -q 'ĐIỂM BÀN GIAO DUY NHẤT' /tmp/nmh-v2-handover.md || { echo "::error::Canonical handover not served"; false; }
          curl --fail --silent --show-error --max-time 20 "${TARGET}/api/docs/maintenance" -o /tmp/nmh-v2-maintenance.md
          grep -q '## A. HIỆN TRẠNG ĐANG CHẠY' /tmp/nmh-v2-maintenance.md || { echo "::error::Stale maintenance document"; false; }
          grep -q 'F16' /tmp/nmh-v2-maintenance.md || { echo "::error::Maintenance audit findings missing"; false; }
          echo "DEPLOY_DOCS=CANONICAL_AND_CURRENT_OK"
          HTTP_STATUS=$(curl --silent --show-error --max-time 15 -o /tmp/nmh-bad-key.json -w '%{http_code}' "${TARGET}/api/chat" \
            -X POST -H "Origin: ${TARGET}" -H 'Content-Type: application/json' \
            --data '{"apiKey":"invalid","messages":[{"role":"user","content":"hi"}]}')
          test "${HTTP_STATUS}" = "400" || { echo "::error::Expected 400, got ${HTTP_STATUS}"; false; }
          python3 -c 'import json;d=json.load(open("/tmp/nmh-bad-key.json"));assert "error" in d'
          TTS_STATUS=$(curl --silent --show-error --max-time 15 -o /tmp/nmh-bad-tts.json -w '%{http_code}' "${TARGET}/api/tts" \
            -X POST -H "Origin: ${TARGET}" -H 'Content-Type: application/json' \
            --data '{"apiKey":"invalid","text":"test"}')
          test "${TTS_STATUS}" = "400" || { echo "::error::TTS validation expected 400"; false; }
          python3 -c 'import json;assert "error" in json.load(open("/tmp/nmh-bad-tts.json"))'
          echo "DEPLOY_SECURITY=VALIDATION_OK"
          trap - ERR
          echo "DEPLOY_FINAL=SUCCESS"



