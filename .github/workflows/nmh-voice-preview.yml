name: Deploy NMH Voice GPT to Cloudflare
on:
  push:
    branches: [nmh-voice-gpt-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Worker JavaScript syntax
        run: node --check voice-deploy/worker.js
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NMH_CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Cloudflare credentials missing: NMH_CF_API_TOKEN and NMH_CF_ACCOUNT_ID are both required. No deployment performed."
            exit 1
          fi
          if [[ "${CLOUDFLARE_ACCOUNT_ID}" != "769c2ab4af5ad50700039d473a72d48e" ]]; then
            echo "::error::Configured Cloudflare account does not match the approved Magical Budget account ID. No deployment performed."
            exit 1
          fi
          echo "Deploying NMH Voice GPT to the configured persistent Cloudflare account"
          npx --yes wrangler@4.102.0 deploy --config voice-deploy/wrangler.jsonc
