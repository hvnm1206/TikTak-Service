name: NMH Voice GPT — verify and guarded production deploy
on:
  push:
    branches: [nmh-voice-gpt-v1]
  workflow_dispatch:
    inputs:
      deploy_live:
        description: 'Deploy to verified Magical Budget Worker (requires rollback readiness)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check voice-deploy/worker.js
          node --check voice-deploy/agent-v2.js
      - name: Test assistant, tools, TTS and Voice UI
        run: |
          node --test voice-deploy/agent-v2.test.mjs voice-deploy/worker-v2.test.mjs
      - name: Check Cloudflare CI readiness without deploying or revealing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_API_TOKEN=NOT_CONFIGURED"
            exit 0
          fi
          if [[ "${CLOUDFLARE_ACCOUNT_ID}" != "769c2ab4af5ad50700039d473a72d48e" ]]; then
            echo "CLOUDFLARE_ACCOUNT=WRONG_TARGET"
            exit 0
          fi
          if ! curl --silent --show-error --max-time 12 --output /tmp/cf-token-verify.json -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" https://api.cloudflare.com/client/v4/user/tokens/verify; then
            echo "CLOUDFLARE_TOKEN=VERIFY_NETWORK_ERROR"
            exit 0
          fi
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/cf-token-verify.json'))
              status=d.get('result',{}).get('status','unknown')
              print('CLOUDFLARE_TOKEN='+('ACTIVE' if d.get('success') and status=='active' else 'NOT_VERIFIED'))
          except Exception:
              print('CLOUDFLARE_TOKEN=INVALID_RESPONSE')
          PY
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_live == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare target and credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing Cloudflare CI credentials. No deployment."
            exit 1
          fi
          if [[ "${CLOUDFLARE_ACCOUNT_ID}" != "769c2ab4af5ad50700039d473a72d48e" ]]; then
            echo "::error::Cloudflare Account ID mismatch. No deployment."
            exit 1
          fi
      - name: Deploy approved Cloudflare Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
        run: npx --yes wrangler@4.102.0 deploy --config voice-deploy/wrangler.jsonc
