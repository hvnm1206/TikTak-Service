name: NGỐ P0 — persistent isolated iPhone pilot
on:
  push:
    branches: [nmh-voice-actions-reminders-p0-20261114]
permissions:
  contents: read
concurrency:
  group: ngo-p0-pilot-provision
  cancel-in-progress: false
jobs:
  pilot:
    if: >-
      startsWith(github.event.head_commit.message, 'pilot(ngo): provision isolated iPhone pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_CF_API_TOKEN }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.NMH_V3_CF_PROVISION_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
      GOOGLE_CLIENT: ${{ secrets.NMH_V3_GOOGLE_CLIENT_ID }}
      PILOT_WORKER: nmh-ngo-p0-pilot-20261114
      PILOT_DB: nmh-ngo-p0-pilot-d1-20261114
      PROD_DB: 3ce295cb-a84d-4a50-abee-d14fdd903514
      PROD_VERSION: cd66b9f6-b7a7-4970-abf8-ce1ef19e1446
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Gate 1 — all legacy and new regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test voice-deploy/agent-v2.test.mjs voice-deploy/worker-v2.test.mjs voice-deploy/v3-backend.test.mjs voice-deploy/voice-write.test.mjs voice-deploy/memory-v2.test.mjs voice-deploy/memory-v2.preference.test.mjs
          node --experimental-sqlite --test voice-deploy/reminders.test.mjs voice-deploy/reminders-client.test.mjs
      - name: Gate 2 — check production version and create separate pilot database
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,re,urllib.request
          a='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          def call(url,token,method='GET',body=None):
           hdr={'Authorization':'Bearer '+token,'Content-Type':'application/json','User-Agent':'NMH-NGO-P0-PILOT/1'}
           req=urllib.request.Request(url,headers=hdr,method=method,data=json.dumps(body).encode() if body is not None else None)
           with urllib.request.urlopen(req,timeout=35) as r:res=json.load(r)
           assert res.get('success'),res.get('errors')
           return res['result']
          v=call(a+'/workers/scripts/nmh-voice-gpt-test/deployments',os.environ['CLOUDFLARE_API_TOKEN'])['deployments'][0]['versions']
          assert len(v)==1 and v[0]['percentage']==100 and v[0]['version_id']==os.environ['PROD_VERSION'],'PRODUCTION_DRIFT'
          assert re.fullmatch(r'[0-9]+-[a-z0-9-]+[.]apps[.]googleusercontent[.]com',os.environ['GOOGLE_CLIENT'])
          db=a+'/d1/database'
          items=call(db+'?per_page=100',os.environ['CLOUDFLARE_D1_TOKEN'])
          items=items if isinstance(items,list) else items.get('databases',[])
          assert not any(x['name']==os.environ['PILOT_DB'] for x in items),'Pilot DB exists; no overwrite'
          created=call(db,os.environ['CLOUDFLARE_D1_TOKEN'],'POST',{'name':os.environ['PILOT_DB']})
          uuid=created.get('uuid') or created.get('id')
          assert re.fullmatch(r'[0-9a-f-]{36}',str(uuid)) and uuid!=os.environ['PROD_DB']
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PILOT_DB_UUID='+uuid+'\n')
          print('PILOT_ISOLATION_AND_PROD_VERSION_GATE=PASS')
          PY
      - name: Gate 3 — migrate only separate pilot D1 and deploy only separate pilot Worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          name=os.environ['PILOT_WORKER'];db=os.environ['PILOT_DB_UUID']
          assert name!='nmh-voice-gpt-test' and db!=os.environ['PROD_DB']
          cfg={'name':name,'main':'worker.js','compatibility_date':'2026-10-01','workers_dev':True,
           'd1_databases':[{'binding':'NMH_DB','database_name':os.environ['PILOT_DB'],'database_id':db}],
           'vars':{'NMH_V3_GOOGLE_CLIENT_ID':os.environ['GOOGLE_CLIENT'],'NMH_REMINDERS_MODE':'active','NMH_MEMORY_V2_MODE':'off'}}
          with open('voice-deploy/wrangler-ngo-pilot.generated.jsonc','w') as f:json.dump(cfg,f)
          PY
          for file in 0001_v3.sql 0002_v3_d1_only.sql 0003_memory_v2.sql 0004_reminders.sql;do
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_TOKEN" npx --yes wrangler@4.102.0 d1 execute "$PILOT_DB" --remote --config voice-deploy/wrangler-ngo-pilot.generated.jsonc --file "voice-deploy/migrations/$file"
          done
          deployed=0
          for attempt in 1 2 3;do
            if (cd voice-deploy && npx --yes wrangler@4.102.0 deploy --config wrangler-ngo-pilot.generated.jsonc);then deployed=1;break;fi
            sleep 7
          done
          test "$deployed" = 1
          echo 'PILOT_REMOTE_D1_MIGRATION_AND_DEPLOY=PASS'
      - name: Gate 4 — HTTP smoke, owner isolation, production unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.error
          origin='https://'+os.environ['PILOT_WORKER']+'.magical-budget.workers.dev'
          def get(path):
           req=urllib.request.Request(origin+path,headers={'User-Agent':'NMH-NGO-P0-PILOT/1'})
           try:
            with urllib.request.urlopen(req,timeout=20) as r:return r.status,r.read().decode()
           except urllib.error.HTTPError as e:return e.code,e.read().decode()
          for _ in range(12):
           try:
            status,txt=get('/health')
            if status==200 and json.loads(txt).get('ok'):break
           except Exception:pass
           time.sleep(4)
          else:raise AssertionError('Pilot Worker health failed')
          code,cfg=get('/api/v3/config');assert code==200 and json.loads(cfg).get('ready')
          code,cap=get('/api/reminders/capabilities');assert code==200 and json.loads(cap).get('enabled') is True
          code,unauth=get('/api/reminders/due');assert code==401,'Anonymous due access!'
          code,page=get('/');assert code==200
          for marker in ('nmhReminderToast','id="start"','id="resume"','id="avatar"','Marin'):
           assert marker in page,marker
          a='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          def cf(path,token):
           req=urllib.request.Request(a+path,headers={'Authorization':'Bearer '+token})
           with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
           assert data['success']
           return data['result']
          v=cf('/workers/scripts/nmh-voice-gpt-test/deployments',os.environ['CLOUDFLARE_API_TOKEN'])['deployments'][0]['versions']
          assert len(v)==1 and v[0]['percentage']==100 and v[0]['version_id']==os.environ['PROD_VERSION']
          assert cf('/d1/database/'+os.environ['PROD_DB'],os.environ['CLOUDFLARE_D1_TOKEN'])
          print('PILOT_HTTP_AUTH_UI_AND_PRODUCTION_INTACT=PASS')
          print('PILOT_IPHONE_URL='+origin)
          print('NOTE: GPT_REAL_KEY_AND_PHYSICAL_IPHONE_SPEECH_STILL_REQUIRE_UAT')
          PY
      - name: Report — keep isolated pilot available for physical iPhone UAT
        if: success()
        run: |
          echo "## NGỐ P0 — isolated iPhone pilot" >> "$GITHUB_STEP_SUMMARY"
          echo "Pilot: https://$PILOT_WORKER.magical-budget.workers.dev/" >> "$GITHUB_STEP_SUMMARY"
          echo "Production: no changes; remains on exact baseline version." >> "$GITHUB_STEP_SUMMARY"
          echo "On physical iPhone: Google sign-in in pilot, paste own OpenAI key, test 2-minute reminder, Marin, mic, refresh, multi-tab." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT production release. Pilot DB and Worker deliberately remain until UAT outcome." >> "$GITHUB_STEP_SUMMARY"
