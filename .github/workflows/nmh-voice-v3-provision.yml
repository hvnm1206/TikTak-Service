name: NMH Voice V3 — D1 R2 provision with explicit approval
on:
  workflow_dispatch:
    inputs:
      stage:
        description: inspect is read-only; provision creates D1 and R2 if authorized
        type: choice
        required: true
        default: inspect
        options: [inspect, provision]
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.NMH_V3_CF_PROVISION_TOKEN }}
      CF_ACCOUNT: '769c2ab4af5ad50700039d473a72d48e'
      GOOGLE_CLIENT: ${{ secrets.NMH_V3_GOOGLE_CLIENT_ID }}
      MODE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged V3 source before any provisioning
        run: |
          set -euo pipefail
          node --check voice-deploy/worker.js
          node --check voice-deploy/v3-backend.js
          node --check voice-deploy/v3-ui.js
          node --test voice-deploy/agent-v2.test.mjs voice-deploy/worker-v2.test.mjs voice-deploy/v3-backend.test.mjs
      - name: Read account permissions and optionally provision missing resources
        id: resource
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" ]]; then
            echo "::error::NMH_V3_CF_PROVISION_TOKEN not configured (Cloudflare Account D1 Edit + R2 Edit required)"
            exit 1
          fi
          if [[ "$MODE" == "provision" && ! "$GOOGLE_CLIENT" =~ ^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::NMH_V3_GOOGLE_CLIENT_ID missing or invalid"
            exit 1
          fi
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          account=os.environ['CF_ACCOUNT'];token=os.environ['CF_TOKEN'];mode=os.environ['MODE']
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          def api(verb,path,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              req=urllib.request.Request(base+path,method=verb,data=data,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: result=json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try: code=[x.get('code') for x in json.loads(e.read()).get('errors',[])]
                  except Exception: code=[]
                  raise RuntimeError(path+' HTTP '+str(e.code)+' Cloudflare error codes '+str(code))
              if not result.get('success'):raise RuntimeError(path+' permission denied')
              return result.get('result')
          databases=api('GET','/d1/database')
          options=databases if isinstance(databases,list) else databases.get('databases',[])
          database=next((x for x in options if x.get('name')=='nmh-voice-v3'),None)
          buckets=api('GET','/r2/buckets')
          bucketItems=buckets.get('buckets',[]) if isinstance(buckets,dict) else buckets
          bucketExists=any(x.get('name')=='nmh-voice-v3-docs' for x in bucketItems)
          print('V3_D1_PERMISSION=AUTHORIZED; EXISTS='+str(bool(database)))
          print('V3_R2_PERMISSION=AUTHORIZED; EXISTS='+str(bucketExists))
          if mode=='provision':
              if database is None:
                  database=api('POST','/d1/database',{'name':'nmh-voice-v3'})
                  print('V3_D1_CREATE=SUCCESS')
              if not bucketExists:
                  api('POST','/r2/buckets',{'name':'nmh-voice-v3-docs'})
                  print('V3_R2_CREATE=SUCCESS')
              bucketExists=True
          dbid=database.get('uuid',database.get('id','')) if database else ''
          if dbid and not re.fullmatch('[a-fA-F0-9-]{36}',dbid):raise RuntimeError('Unexpected D1 ID')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('database_id='+dbid+'\n')
          print('V3_INFRA='+('READY' if dbid and bucketExists else 'NOT_PROVISIONED'))
          PY
      - name: Initialize D1 schema (only provision mode)
        if: inputs.stage == 'provision'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NMH_V3_CF_PROVISION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
          V3_DB_ID: ${{ steps.resource.outputs.database_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          conf={'name':'nmh-voice-gpt-test','main':'worker.js','compatibility_date':'2026-10-01','workers_dev':True,'d1_databases':[{'binding':'NMH_DB','database_name':'nmh-voice-v3','database_id':os.environ['V3_DB_ID']}],'r2_buckets':[{'binding':'NMH_DOCS','bucket_name':'nmh-voice-v3-docs'}],'vars':{'NMH_V3_GOOGLE_CLIENT_ID':os.environ['GOOGLE_CLIENT']}}
          with open('voice-deploy/wrangler-v3.generated.jsonc','w') as f:json.dump(conf,f)
          PY
          npx --yes wrangler@4.102.0 d1 execute nmh-voice-v3 --remote --config voice-deploy/wrangler-v3.generated.jsonc --file voice-deploy/migrations/0001_v3.sql
          npx --yes wrangler@4.102.0 d1 execute nmh-voice-v3 --remote --config voice-deploy/wrangler-v3.generated.jsonc --command "SELECT COUNT(*) AS n FROM v3_sessions"
          echo "V3_D1_MIGRATION=PASS"
