name: Bản tin AI — kiểm tra RSS + chạy thử (chỉ đọc, không deploy)
on:
  push:
    branches: [ai-news-feed-trial-20261117]
    paths: ['news-feed/**', '.github/workflows/news-feed-trial.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-news-feed-trial
  cancel-in-progress: false
jobs:
  trial:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: '769c2ab4af5ad50700039d473a72d48e'
    steps:
      - uses: actions/checkout@v4
      - name: 1) Kiểm tra từng nguồn RSS
        run: python3 news-feed/probe_rss.py news-feed/sources.json news-feed/out
      - name: Secret OpenAI có sẵn ở đâu? (chỉ in có/không, không in giá trị)
        id: keys
        env:
          K1: ${{ secrets.OPENAI_API_KEY }}
          K2: ${{ secrets.NMH_OPENAI_API_KEY }}
          K3: ${{ secrets.NGO_OPENAI_API_KEY }}
          K4: ${{ secrets.OPENAI_KEY }}
          CF: ${{ secrets.NMH_CF_API_TOKEN }}
        run: |
          {
            echo "GitHub secret OPENAI_API_KEY: $([ -n "$K1" ] && echo CÓ || echo KHÔNG)"
            echo "GitHub secret NMH_OPENAI_API_KEY: $([ -n "$K2" ] && echo CÓ || echo KHÔNG)"
            echo "GitHub secret NGO_OPENAI_API_KEY: $([ -n "$K3" ] && echo CÓ || echo KHÔNG)"
            echo "GitHub secret OPENAI_KEY: $([ -n "$K4" ] && echo CÓ || echo KHÔNG)"
            python3 - <<'PY'
          import os,json,urllib.request
          a='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/nmh-voice-gpt-test/secrets'
          try:
            r=urllib.request.urlopen(urllib.request.Request(a,headers={'Authorization':'Bearer '+os.environ['CF'],'User-Agent':'NMH-NEWS-TRIAL'}),timeout=30)
            print('Tên secret trên Worker nmh-voice-gpt-test: '+json.dumps(sorted(s['name'] for s in json.load(r)['result'])))
          except Exception as e: print('Không đọc được tên secret Worker:',e)
          PY
          } | tee news-feed/out/secrets_presence.txt
          for v in K1 K2 K3 K4; do if [ -n "${!v}" ]; then echo "key_var=$v" >> "$GITHUB_OUTPUT"; break; fi; done
      - name: 2) Chạy thử bản tin bằng GPT (chỉ khi đã có secret OpenAI)
        if: false  # chỉ kiểm tra nguồn, không gọi GPT
        env:
          K1: ${{ secrets.OPENAI_API_KEY }}
          K2: ${{ secrets.NMH_OPENAI_API_KEY }}
          K3: ${{ secrets.NGO_OPENAI_API_KEY }}
          K4: ${{ secrets.OPENAI_KEY }}
          KEYVAR: ${{ steps.keys.outputs.key_var }}
        run: |
          set -o pipefail
          OPENAI_API_KEY="${!KEYVAR}" python3 news-feed/digest_trial.py news-feed/sources.json news-feed/out 2>&1 | tee news-feed/out/digest_log.txt
      - name: Lưu kết quả về nhánh (để đọc lại, không chứa khóa)
        if: always()
        run: |
          git config user.name "nmh-news-trial"; git config user.email "actions@users.noreply.github.com"
          git add news-feed/out
          git commit -m "trial(news-feed): kết quả chạy ${GITHUB_RUN_ID}" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
