<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NMH Vision Assist</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07101c;color:#fff;font-family:Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;background:#0d1826;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;background:#0d1826}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb0c4;font-size:26px;font-weight:700;text-align:center;padding:24px;pointer-events:none}
.panel{background:#07101c;border-top:1px solid #26384d;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.status{min-height:54px;font-size:21px;font-weight:700;line-height:1.3;padding:4px 4px 12px}
.result{font-size:22px;line-height:1.35;min-height:0;margin-bottom:12px}
.buttons{display:grid;gap:12px}
button{width:100%;min-height:78px;border:0;border-radius:22px;font-size:26px;font-weight:900}
#cameraBtn{background:#1684f5;color:white}
#describeBtn{background:#e9d63b;color:#101010}
button:disabled{opacity:.42}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <video id="video" autoplay muted playsinline></video>
    <div class="overlay" id="overlay">Đang mở camera...</div>
  </div>
  <div class="panel">
    <div class="status" id="status">Đang mở camera...</div>
    <div class="result" id="result"></div>
    <div class="buttons">
      <button id="cameraBtn">BẬT CAMERA</button>
      <button id="describeBtn" disabled>MÔ TẢ BẰNG LỜI</button>
    </div>
  </div>
</div>
<script>
const API='https://zalo.nomahubvn.com/webhook/nmh-vision-assist-analyze-v1';
const video=document.getElementById('video');
const overlay=document.getElementById('overlay');
const statusEl=document.getElementById('status');
const resultEl=document.getElementById('result');
const cameraBtn=document.getElementById('cameraBtn');
const describeBtn=document.getElementById('describeBtn');
let stream=null, starting=false, sceneMemory='';

function setStatus(t){statusEl.textContent=t}
function setCameraReady(ready){
  cameraBtn.disabled=ready;
  describeBtn.disabled=!ready;
  overlay.style.display=ready?'none':'flex';
}
function speak(text){
  if(!text||!('speechSynthesis' in window))return;
  try{
    const s=window.speechSynthesis;
    s.cancel();s.resume();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='vi-VN';u.rate=1;u.pitch=1;u.volume=1;
    s.speak(u);
  }catch(e){console.error('speech',e)}
}
async function startCamera(){
  if(stream||starting)return;
  starting=true;setStatus('Đang mở camera...');overlay.textContent='Đang mở camera...';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('MEDIA_UNSUPPORTED');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream;
    try{await video.play()}catch(_){}
    setCameraReady(true);
    setStatus('Camera đã sẵn sàng.');
  }catch(e){
    stream=null;
    setCameraReady(false);
    overlay.textContent='Camera chưa bật';
    setStatus(e&&e.name==='NotAllowedError'
      ? 'Cần cho phép camera cho trang này.'
      : 'Không mở được camera. Bấm BẬT CAMERA để thử lại.');
  }finally{starting=false}
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function grabFrame(){
  const vw=video.videoWidth||640,vh=video.videoHeight||480;
  const scale=Math.min(1,640/Math.max(vw,vh));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(vw*scale));c.height=Math.max(1,Math.round(vh*scale));
  c.getContext('2d',{alpha:false}).drawImage(video,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.58);
}
cameraBtn.onclick=startCamera;
describeBtn.onclick=async()=>{
  if(!stream||describeBtn.disabled)return;
  describeBtn.disabled=true;
  describeBtn.textContent='ĐANG QUAN SÁT...';
  setStatus('Đang quan sát...');
  resultEl.textContent='';
  try{
    if(video.paused){try{await video.play()}catch(_){}}
    const frames=[grabFrame()];
    await wait(650);frames.push(grabFrame());
    await wait(650);frames.push(grabFrame());
    await wait(700);frames.push(grabFrame());
    const form=new FormData();
    form.append('frames',JSON.stringify(frames));
    form.append('sceneMemory',sceneMemory);
    const r=await fetch(API,{method:'POST',body:form});
    const j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
    sceneMemory=String(j.sceneMemory||'');
    resultEl.textContent=j.description||'';
    setStatus('Đã quan sát.');
    if(navigator.vibrate){try{navigator.vibrate(60)}catch(_){}}
    speak(j.description||'');
  }catch(e){
    console.error(e);
    setStatus('Không mô tả được. Hãy thử lại.');
    resultEl.textContent='';
  }finally{
    describeBtn.textContent='MÔ TẢ BẰNG LỜI';
    describeBtn.disabled=!stream;
  }
};
startCamera();
</script>
</body>
</html>
